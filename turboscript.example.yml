version: 1

# TurboScript Configuration Example
# This file demonstrates all available configuration options

# Server configuration
port: 7890
debug: true
info: true
warning: true
monitoring: true
timeout: 30 # Global timeout in seconds for async operations
preserve_response: false
prefer_ts: false # Prefer .ts files over .js files

# Server-specific settings
server:
  pool_size: 10              # Executor pool size for concurrent request processing
  profiler_port: "6060"      # Port for pprof profiler server
  performance_interval: 30   # Performance metrics collection interval in seconds
  http_timeout: 30           # HTTP client timeout in seconds for outbound requests
  initial_cleanup_delay: 30  # Initial cleanup delay in seconds for job manager

# Response compression configuration
compression:
  enabled: true
  min_size: 1024 # Minimum response size in bytes to compress
  level: 6       # Compression level 1-9 (1=fastest, 9=best, 6=balanced)

# Database configuration with multiple connections
database:
  default: "main"
  connections:
    main:
      driver: "postgres"
      host: "${env:DB_HOST, localhost}"
      port: ${env:DB_PORT, 5432}
      username: "${env:DB_USERNAME, postgres}"
      password: "${env:DB_PASSWORD, password}"
      database: "${env:DB_NAME, turboscript}"
      max_open_connections: 25
      max_idle_connections: 10
      connection_timeout: 30
      max_lifetime: 3600
      max_idle_time: 600
      ssl_mode: "disable"
      timezone: "UTC"

# Cache configuration
cache:
  default: "memory"
  drivers:
    memory:
      driver: "memory"
      max_size: 128     # Maximum cache size in MB
      expiration: 3600  # Default expiration time in seconds
    redis:
      driver: "redis"
      host: "${env:REDIS_HOST, localhost}"
      port: ${env:REDIS_PORT, 6379}
      password: "${env:REDIS_PASSWORD}"
      db: ${env:REDIS_DB, 0}
      max_idle_connections: 10
      max_active_connections: 100
      idle_timeout: 300
      read_timeout: 30
      write_timeout: 30

# Email configuration
email:
  default_driver: "smtp"
  from_address: "noreply@example.com"
  from_name: "TurboScript App"
  smtp:
    host: "${env:SMTP_HOST, localhost}"
    port: ${env:SMTP_PORT, 587}
    username: "${env:SMTP_USERNAME}"
    password: "${env:SMTP_PASSWORD}"
    encryption: "tls"

# Background jobs configuration
jobs:
  enabled: true
  max_workers: 10
  retry_attempts: 3
  retry_delay: 5
  timeout: 30
  queue_size: 1000
  path: "./app/jobs"

# Scheduler Configuration
# Similar to cron jobs but integrated with TurboScript's TypeScript execution environment
scheduler:
  enabled: true
  timezone: "UTC"           # Default timezone for all scheduled tasks
  path: "./app/schedulers"  # Directory containing scheduler handler files
  log_level: "info"         # Logging level for scheduler: debug, info, warn, error

  tasks:
    # Jobs retention cleanup task - runs daily at 2 AM
    - name: "jobs-retention-cleanup"
      cron: "0 0 2 * * *"                  # Daily at 2:00 AM UTC (seconds, minutes, hours, day, month, weekday)
      handler: "jobs-retention.ts"         # Relative to scheduler path
      enabled: true
      timezone: "UTC"
      timeout: 300                         # 5 minutes timeout for cleanup
      description: "Clean up old jobs and job history records based on retention policy"
      payload:
        cleanup_type: "all"                # Can be: jobs, history, all
        dry_run: false                     # Set to true to see what would be deleted without actually deleting
      environment:
        CLEANUP_LOG_LEVEL: "info"

    # Example: Daily analytics processing
    - name: "daily-analytics"
      cron: "0 0 3 * * *"                  # Daily at 3:00 AM UTC (6-field cron format)
      handler: "daily-analytics.ts"
      enabled: false                       # Disabled by default
      timezone: "UTC"
      timeout: 600                         # 10 minutes timeout
      description: "Process daily analytics and generate reports"
      payload:
        date: "yesterday"                  # Special value for yesterday's date
        include_charts: true
      environment:
        ANALYTICS_DEBUG: "false"

    # Example: Weekly report generation
    - name: "weekly-reports"
      cron: "0 0 1 * * 1"                  # Weekly on Monday at 1:00 AM UTC
      handler: "weekly-reports.ts"
      enabled: false                       # Disabled by default
      timezone: "America/New_York"         # Custom timezone
      timeout: 1800                        # 30 minutes timeout
      description: "Generate and email weekly reports to administrators"
      payload:
        report_type: "summary"
        recipients: ["admin@example.com"]
      environment:
        REPORT_DEBUG: "false"

    # Example: Hourly health checks
    - name: "health-check"
      cron: "0 0 * * * *"                  # Every hour on the hour
      handler: "health-check.ts"
      enabled: false                       # Disabled by default
      timezone: "UTC"
      timeout: 60                          # 1 minute timeout
      description: "Perform system health checks and alerting"
      payload:
        check_database: true
        check_external_apis: true
        alert_threshold: 5000              # Response time threshold in ms

# Environment variables to inject into TypeScript execution context
env:
  APP_ENV: "development"
  JWT_ACCESS_SECRET: "${env:JWT_ACCESS_SECRET, your-secret-key}"
  JWT_REFRESH_SECRET: "${env:JWT_REFRESH_SECRET, your-refresh-secret}"

# TypeScript Compiler Configuration
typescript:
  # External modules to exclude from bundling (keep as imports)
  # These modules are provided by the runtime environment
  external_modules:
    - "bcryptjs"
    - "crypto"
    - "node:crypto"
    - "node:url"
    - "node:assert"
    - "node:util"
    - "fs"
    - "path"
    - "os"
    - "argon2"           # Custom implementation provided by runtime
    - "mongoose"         # If using MongoDB
    - "pg"               # If using PostgreSQL driver directly
  target: "ES2020"       # TypeScript compilation target
  format: "CommonJS"     # Output format (CommonJS, ESM, IIFE)

# API endpoints configuration
endpoints:
  # Standard API endpoint
  - route: "/api/users"
    method: "GET"
    path: "./app/routes/users/index.ts"
    type: "api"
    timeout: 15 # Override global timeout for this specific endpoint

  # WebSocket endpoint with custom configuration
  - route: "/ws/chat"
    method: "WebSocket"
    path: "./app/websockets/chat.ts"
    type: "websocket"
    websocket:
      read_buffer_size: 2048    # Custom buffer sizes
      write_buffer_size: 2048
      ping_interval: 30         # Ping interval in seconds
      pong_timeout: 60          # Pong timeout in seconds
      max_message_size: 1048576 # 1MB max message size
      enable_compression: true
      compression_level: 6
      allowed_origins:
        - "http://localhost:3000"
        - "https://example.com"

  # Server-Sent Events endpoint
  - route: "/events"
    method: "SSE"
    path: "./app/routes/events.ts"
    type: "sse"
    sse:
      enable_http2: true
      keepalive_interval: 30 # Keep-alive interval in seconds
      retry: 3000           # Retry interval in milliseconds
      max_connections: 1000
      buffer_size: 2048
      enable_compression: true
      allowed_origins:
        - "http://localhost:3000"
        - "https://example.com"

  # Markdown to HTML folder endpoint
  - route: "/docs/{path:.*}"
    method: "GET"
    path: "./app/docs"
    type: "markdown-html"
    options:
      index: "index.md"
      layout: "layout.html"

# Plugin configurations
plugins:
  - name: "fileupload"
    enabled: true
    options:
      max_file_size: 10485760 # 10MB
      allowed_extensions:
        - ".jpg"
        - ".png"
        - ".pdf"
      storage_path: "./uploads"

  - name: "broadcast"
    enabled: true
    options:
      enable_kafka: false
      enable_redis: false
