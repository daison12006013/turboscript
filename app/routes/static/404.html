<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{title}}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        'docs-dark': {
                            '50': '#f8fafc',
                            '100': '#f1f5f9',
                            '200': '#e2e8f0',
                            '300': '#cbd5e1',
                            '400': '#94a3b8',
                            '500': '#64748b',
                            '600': '#475569',
                            '700': '#334155',
                            '800': '#1e293b',
                            '900': '#0f172a',
                            '950': '#020617'
                        }
                    }
                }
            }
        }
    </script>
    <style>
        /* Custom scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
        }

        ::-webkit-scrollbar-track {
            background: #1e293b;
        }

        ::-webkit-scrollbar-thumb {
            background: #475569;
            border-radius: 3px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #64748b;
        }

        /* Smooth transitions */
        * {
            transition: all 0.2s ease;
        }
    </style>
</head>

<body class="bg-docs-dark-950 text-docs-dark-100 font-sans antialiased">
    @turboHtml("static/navbar.html")
    <div class="min-h-screen flex items-center justify-center">
        <div class="max-w-md w-full mx-auto px-6">
            <div class="text-center">
                <div class="mb-8">
                    <h1 class="text-9xl font-bold text-transparent bg-gradient-to-r from-red-500 to-red-600 bg-clip-text">
                        404
                    </h1>
                </div>

                <div class="mb-8">
                    <h2 class="text-2xl font-bold text-white mb-4">Page Not Found</h2>
                    <p class="text-docs-dark-300 text-lg leading-relaxed">
                        Sorry, the page you are looking for doesn't exist or has been moved.
                    </p>
                </div>

                <div class="space-y-4">
                    <a href="/" class="inline-flex items-center px-6 py-3 bg-gradient-to-r from-red-500 to-red-600 text-white font-medium rounded-lg hover:from-red-600 hover:to-red-700 transition-all duration-200 transform hover:scale-105 shadow-lg">
                        <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path>
                        </svg>
                        Go Home
                    </a>

                    <div class="text-center">
                        <button onclick="history.back()" class="text-docs-dark-400 hover:text-white transition-colors underline text-sm">
                            Or go back to previous page
                        </button>
                    </div>
                </div>

                <div class="mt-12 p-6 bg-docs-dark-900 border border-docs-dark-800 rounded-lg">
                    <h3 class="text-lg font-semibold text-white mb-3">Need Help?</h3>
                    <p class="text-docs-dark-300 text-sm mb-4">
                        If you believe this is an error, please check the URL or contact support.
                    </p>
                    <div class="flex justify-center space-x-4">
                        <a href="/docs" class="text-red-400 hover:text-red-300 transition-colors text-sm underline">
                            Documentation
                        </a>
                        <a href="https://github.com/daison12006013/turboscript" class="text-red-400 hover:text-red-300 transition-colors text-sm underline" target="_blank" rel="noopener noreferrer">
                            GitHub Issues
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
    @turboHtml("static/footer.html")
</body>

</html>
