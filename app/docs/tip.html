    let currentTipIndex = 0;
    let typewriterTimeout;
    let isTyping = false;

    // Function to get a random tip
    function getRandomTip() {
        const randomIndex = Math.floor(Math.random() * proTips.length);
        currentTipIndex = randomIndex;
        return proTips[randomIndex];
    }

    // Function to create typewriter effect
    function typeWriter(element, text, speed = 30) {
        return new Promise((resolve) => {
            element.innerHTML = '';
            let i = 0;
            let currentText = '';

            function type() {
                if (i < text.length) {
                    const char = text.charAt(i);
                    currentText += char;

                    // Handle HTML tags by adding them all at once
                    if (char === '<') {
                        const closingTagIndex = text.indexOf('>', i);
                        if (closingTagIndex !== -1) {
                            currentText = currentText.slice(0, -1) + text.substring(i, closingTagIndex + 1);
                            i = closingTagIndex;
                        }
                    }

                    element.innerHTML = currentText + '<span class="typing-cursor">|</span>';
                    i++;
                    typewriterTimeout = setTimeout(type, speed);
                } else {
                    // Remove cursor after typing is complete
                    element.innerHTML = currentText;
                    resolve();
                }
            }
            type();
        });
    }

    // Function to render the tip with typewriter effect
    async function renderRandomTip() {
        if (isTyping) return;

        isTyping = true;
        const tip = getRandomTip();
        const alertDiv = document.querySelector('.alert');

        if (alertDiv) {
            // Clear any existing timeout
            if (typewriterTimeout) {
                clearTimeout(typewriterTimeout);
            }

            // Set the title immediately
            const titleElement = alertDiv.querySelector('h4');
            const contentElement = alertDiv.querySelector('p');

            if (titleElement && contentElement) {
                titleElement.textContent = `${tip.icon} ${tip.title}`;
                await typeWriter(contentElement, tip.content, 25);
            } else {
                alertDiv.innerHTML = `
                    <h4>${tip.icon} ${tip.title}</h4>
                    <p></p>
                `;
                const newContentElement = alertDiv.querySelector('p');
                await typeWriter(newContentElement, tip.content, 25);
            }
        }

        isTyping = false;
    }

    // Function to change to next tip
    function nextTip() {
        if (!isTyping) {
            renderRandomTip();
        }
    }

    // Initialize random tip when DOM is loaded
    document.addEventListener('DOMContentLoaded', function () {
        renderRandomTip();
    });

    // Change tip every 15 seconds (increased time to account for typing animation)
    setInterval(nextTip, 15000);
